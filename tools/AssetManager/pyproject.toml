[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etherfood-studio"
version = "0.1.0"
description = "Lokales EtherFood Asset Studio"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
images = ["Pillow==12.1.1"]
gui = ["PySide6==6.10.2", "Pillow==12.1.1", "markdown-it-py==4.0.0"]
test = ["pytest==8.4.2", "jsonschema==4.26.0", "Pillow==12.1.1"]

[project.scripts]
etherfood-studio = "etherfood_studio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
